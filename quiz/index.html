    .qtabs button { background:#fff; border:1.5px solid var(--border); color:var(--dim); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
    .qtabs button.on { border-color:var(--blue); color:var(--blue); background:var(--blue-light); }
    .answers { display:grid; gap:12px; }
    .ans-btn { background:#fff; border:2px solid var(--border); border-radius:14px; padding:16px 18px; font-size:19px; font-weight:700; color:var(--navy); cursor:pointer; text-align:left; font-family:inherit; transition: border-color .15s; }
    .ans-btn:hover { border-color:var(--blue); }
    .ans-btn:disabled { cursor:default; opacity:.85; }
    .ans-btn.correct { border-color:var(--green); background:var(--green-light); }
    .ans-btn.wrong { border-color:#dc2626; background:#fef2f2; }

    .ans-bar > div { height:100%; background:var(--blue); border-radius:99px; }
    .ans-count { font-size:13px; color:var(--dim); margin-top:5px; font-weight:600; }
    .stats-line { text-align:center; color:var(--muted); font-size:13.5px; margin:14px 0 0; }
    .reveal-box { margin-top:26px; display:none; }
    .reveal-box.show { display:block; }
    .reveal-grid { display:grid; gap:16px; }
    @media(min-width:700px){ .reveal-grid { grid-template-columns:1fr 1fr; } }
    .rbox { border-radius:14px; padding:20px; border:1px solid var(--border); background:var(--surface); }
    .rbox.cb { background:var(--green-light); border-color:#a7f3d0; }
    .rbox h3 { font-size:16px; margin-bottom:10px; }
    .rbox.ai h3 { color:var(--dim); }
    .rbox .ai-answer { font-size:22px; font-weight:700; color:var(--navy); margin:10px 0 4px; }
    .rbox .ai-note { font-size:13.5px; color:var(--muted); }
    .chat { display:flex; flex-direction:column; gap:10px; margin-top:6px; }
    .cbub { padding:10px 14px; border-radius:12px; font-size:14.5px; line-height:1.55; }
    .cbub.t { background:#fff; border:1px solid #a7f3d0; color:var(--navy); }
    .cbub.s { background:#fff; border:1px dashed var(--border); color:var(--dim); font-style:italic; align-self:flex-end; max-width:88%; }
    .verdict { margin-top:12px; font-weight:700; color:var(--green); font-size:15px; }
    .pitch { margin-top:26px; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px 20px; }
    .pitch h2 { font-size:20px; margin-bottom:8px; }
    .pitch p { font-size:15px; margin-bottom:16px; }
    .pitch .btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .btn { display:inline-block; padding:13px 28px; border-radius:10px; font-weight:700; font-size:15px; text-decoration:none; font-family:Arial,sans-serif; cursor:pointer; border:none; }
    .btn-primary { background:var(--blue); color:#fff; }
    .btn-primary:hover { background:#1d4ed8; text-decoration:none; color:#fff; }
    .btn-outline { background:transparent; border:2px solid var(--border); color:var(--dim); }
    .btn-outline:hover { border-color:var(--blue); color:var(--blue); text-decoration:none; }
    .quiz-foot { text-align:center; margin-top:34px; color:var(--muted); font-size:13px; }
    .quiz-foot a { color:var(--dim); }

  function qs(name){
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function setLang(l){
    lang = l;
    document.getElementById('langVi').className = l === 'vi' ? 'on' : '';
    document.getElementById('langEn').className = l === 'en' ? 'on' : '';
    document.documentElement.lang = l;

  function optText(o){ return typeof o === 'object' ? o[lang] : o; }

  function record(eventType, answer, cb){
    var q = QUIZ[current];
    try {
      fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question_id: q.id,
          event_type: eventType,
          answer: answer,
          lang: lang,
          source: qs('src') || '',
          referrer: document.referrer || ''
        })
      }).then(function(r){ return r.json(); }).then(function(d){
        if (d && d.stats) { stats = d.stats; renderStats(); }
        if (cb) cb();
      }).catch(function(){ if (cb) cb(); });
    } catch(e) { if (cb) cb(); }
  }

  function voteKey(){ return 'quiz_vote_' + QUIZ[current].id; }

    el.textContent = bits.length ? bits.join(' · ') : '';
  }

      tabs.appendChild(b);

    document.getElementById('qSub').textContent = q.sub[lang];

    document.getElementById('ctaPricing').onclick = function(){ record('cta', 'pricing'); };
    document.getElementById('qShare').textContent = u.share;
    document.getElementById('aiAnswer').textContent = q.ai[lang];

    // coach chat
    var chat = document.getElementById('cbChat');
    chat.innerHTML = '';
    q.chat[lang].forEach(function(turn){
      var d = document.createElement('div');
      d.className = turn[0] === 't' ? 'cbub t' : 'cbub s';
      d.textContent = turn[1];
      chat.appendChild(d);
    });
    document.getElementById('cbVerdict').textContent = q.verdict[lang];

    // answers
    var box = document.getElementById('answers');
    box.innerHTML = '';
    var alreadyVoted = null;
    try { alreadyVoted = localStorage.getItem(voteKey()); } catch(e){}
    q.options.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'ans-btn';
      b.textContent = optText(o);
      if (alreadyVoted !== null) {
        b.disabled = true;
        var chosen = alreadyVoted === String(i);
        if (i === q.correct) b.classList.add('correct');
        else if (chosen) b.classList.add('wrong');
        if (stats.totalVotes > 0) {
          var n = stats.votes[String(i)] || 0;
          var pct = stats.totalVotes ? Math.round(n * 100 / stats.totalVotes) : 0;
          var bar = document.createElement('div');
          bar.className = 'ans-bar';
          bar.innerHTML = '<div style="width:' + pct + '%"></div>';
          var cnt = document.createElement('div');
          cnt.className = 'ans-count';
          cnt.textContent = pct + '% (' + n + ')';
          b.appendChild(bar); b.appendChild(cnt);
        }
        b.onclick = null;
      } else {
        b.onclick = function(){
          try { localStorage.setItem(voteKey(), String(i)); } catch(e){}
          record('vote', String(i), function(){ render(); });
        };
      }
      box.appendChild(b);
    });
    document.getElementById('revealBox').classList.add('show');
    renderStats();
  }

  function reveal(){
    var key = 'quiz_reveal_' + QUIZ[current].id;
    var seen = false;
    try { seen = !!localStorage.getItem(key); localStorage.setItem(key, '1'); } catch(e){}
    document.getElementById('revealBox').classList.add('show');
    if (!seen) record('reveal', '');
  }

  function go(i){
    current = i;
    try { history.replaceState(null, '', '?q=' + (i+1) + (qs('src') ? '&src=' + qs('src') : '')); } catch(e){}
    var seen = false;
    try { seen = !!localStorage.getItem(viewKey()); localStorage.setItem(viewKey(), '1'); } catch(e){}
    render();
    reveal();
    window.scrollTo(0, 0);
    if (!seen) record('view', '');
  }

  // init
  var saved = null;
  try { saved = localStorage.getItem('cb_lang'); } catch(e){}
  var qParam = parseInt(qs('q') || '1', 10);
  current = (qParam >= 1 && qParam <= QUIZ.length) ? qParam - 1 : 0;
  setLang(saved === 'en' ? 'en' : 'vi');
  go(current);
})();
</script>
</body>
</html>
